<!doctype html>
<html>
<head><meta charset="utf-8" /><style>html,body{margin:0;overflow:hidden;background:#20242b}#info{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;z-index:2;white-space:pre-wrap}</style></head>
<body>
<div id="info">loading</div>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { CharacterLibrary } from '/src/characters.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242b);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
const dl = new THREE.DirectionalLight(0xffffff, 2.0); dl.position.set(3, 7, 5); scene.add(dl);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.15, 3.0); camera.lookAt(0, 0.95, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.GridHelper(6, 12, 0x777777, 0x333333));

const lib = new CharacterLibrary({ scene });
await lib.load();
const chars = [lib.create('CT', 1), lib.create('T', 2)];
chars[0]?.root.position.set(-0.7, 0, 0);
chars[1]?.root.position.set(0.7, 0, 0);
chars.forEach((c) => c && scene.add(c.root));
document.getElementById('info').textContent = `ready ${lib.ready} · idle ${!!lib.animations.idle} · run ${!!lib.animations.run}`;
const clock = new THREE.Clock();
const fakeBot = { onGround: true, pitch: 0 };
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  chars.forEach((c) => c?.update(dt, fakeBot, true));
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
